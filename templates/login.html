<!DOCTYPE html>
<html>
<head>
  <title>Pi Cloud — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050510;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0, 80, 180, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 180, 150, 0.1) 0%, transparent 50%),
        #050510;
    }
    .stars::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.7) 0%, transparent 100%);
      background-size: 400px 400px;
      animation: drift 60s linear infinite;
    }
    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-400px); }
    }
    .login-card {
      position: relative;
      z-index: 1;
      width: 380px;
      background: rgba(10, 15, 40, 0.85);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.08), 0 20px 60px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      animation: fadeUp 0.6s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #00d4ff;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    .logo p {
      color: rgba(255,255,255,0.3);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.7);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 14px 16px;
      color: #eaeaea;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00d4ff, #0088cc);
      border: none;
      border-radius: 8px;
      color: #050510;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4);
    }
    .error {
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255, 60, 60, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="login-card">
    <div class="logo">
      <h1>PI CLOUD</h1>
      <p>Secure Access Portal</p>
    </div>
    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit">ENTER</button>
    </form>
  </div>
</body>
</html>
